name: APK

# Construit l'APK Android et le publie en artefact téléchargeable.
#
# Il s'agit d'un APK **debug** : le projet n'a pas de keystore de publication,
# et en produire un signé authentifierait une image de débogage. Le fichier
# est donc explicitement étiqueté comme tel dans son nom.
on:
  # À la demande, depuis l'onglet Actions.
  workflow_dispatch:
  # Et automatiquement pour chaque version publiée.
  push:
    tags:
      - "v*"

concurrency:
  group: apk-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug-apk:
    name: APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: 3.44.1
          channel: stable
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Construction
        run: flutter build apk --debug

      - name: Publication de l'artefact
        uses: actions/upload-artifact@v4
        with:
          name: e-commerce-apk-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 14
          if-no-files-found: error
